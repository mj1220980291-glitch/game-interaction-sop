interface:
  display_name: "游戏交互 SOP"
  short_description: "需求挖掘（先要设计稿）→ v2 Markdown（每簇默认配图）→ 写入 Figma → 配图审计 → 文风沉淀 → 模式库维护的完整 SOP"
  default_prompt: "对这个游戏交互需求执行完整 SOP。先按 Phase 1 开场问有没有设计稿（图片 / Figma 链接）；有图就以图为骨架复述理解、每轮 ≤3 问追问，没图才转策划文档。信息可用后按 Phase 2 输出 v2 Markdown（每簇至少一条配图），给用户审、确认后保存并落快照；Phase 3 把主图与配图条目映射成资产（不再问要不要配图）；Phase 4 调 figma-interaction-doc-engine 写入模板，随后按章截图做配图审计、缺图列清单提醒用户手动配图；Phase 5 把本轮人工改过的表述沉淀进 style_own.md（先列清单确认）；Phase 6 增量维护模式库。每个 Phase 有明确的进入/完成条件，不跨 Phase。"
